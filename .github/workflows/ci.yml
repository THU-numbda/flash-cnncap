name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            h5py==3.16.0 \
            numpy==2.1.0 \
            PyYAML==6.0.1 \
            pytest==8.1.1
      - name: Compile Python sources
        run: python -m compileall -q flash_common full-pipeline scripts training tests
      - name: Run CPU-safe tests
        run: |
          python -m pytest -q \
            tests/test_binary_hdf5_cache.py \
            tests/test_full_pipeline_spec_semantics.py
